<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shark ABC">
<meta name="application-name" content="Shark ABC">
<meta name="theme-color" content="#0a5a9c">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<meta name="description" content="Aaron's Shark ABCs: swim the shark to the next letter of the alphabet. Designed by Adam Ennabe.">

<title>Aaron's Shark ABCs</title>
<style>
  :root{
    --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Avenir Next", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    --navy:#0d2b52;
    --cell:32px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;
    overscroll-behavior:none;touch-action:none;background:#0a5a9c;font-family:var(--font);
    -webkit-text-size-adjust:100%;text-size-adjust:100%;color:#fff;}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #safe{position:fixed;visibility:hidden;pointer-events:none;
    padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);}

  /* Alphabet progress strip */
  #strip{position:fixed;left:0;right:0;top:0;z-index:3;pointer-events:none;display:grid;
    grid-template-columns:repeat(26,1fr);gap:4px;
    padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 6px calc(env(safe-area-inset-left,0px) + 10px);
    background:linear-gradient(rgba(4,40,80,.45),rgba(4,40,80,0));}
  #strip.portrait{grid-template-columns:repeat(13,1fr);}
  #strip span{display:flex;align-items:center;justify-content:center;border-radius:28%;
    background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.30);
    color:rgba(255,255,255,.40);font-weight:900;font-size:calc(var(--cell) * .62);line-height:1;
    transition:background .3s, color .3s, transform .3s;}
  #strip.gone{visibility:hidden;}
  #strip span.next{border-color:#fff;border-style:dashed;animation:nextPulse 1.2s ease-in-out infinite;}
  #strip span.got{color:var(--navy);border-color:rgba(255,255,255,.9);animation:gotPop .55s cubic-bezier(.2,1.6,.4,1);}
  @keyframes nextPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  @keyframes gotPop{0%{transform:scale(.3)}100%{transform:scale(1)}}

  .overlay{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);}
  .hidden{display:none !important;}

  /* Start screen */
  #start{background:radial-gradient(ellipse at 50% 45%, rgba(10,90,156,.15), rgba(3,35,75,.55));}
  #start h1{margin:0 0 2vmin;font-size:min(10vmin,76px);font-weight:900;letter-spacing:.5px;color:#fff;
    text-shadow:0 4px 0 #0b4c86, 0 8px 24px rgba(0,0,0,.35);}
  #start h1 .abc{color:#ffd84d;}
  .bigbtn{appearance:none;border:0;outline:0;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;
    width:min(34vmin,220px);height:min(34vmin,220px);
    background:radial-gradient(circle at 35% 30%, #fff6b8, #ffd84d 45%, #f5a623);
    box-shadow:0 10px 0 #c97c00, 0 18px 40px rgba(0,0,0,.35), inset 0 -6px 14px rgba(201,124,0,.35);
    animation:breathe 1.6s ease-in-out infinite;touch-action:manipulation;}
  .bigbtn:active{transform:translateY(6px) scale(.97);box-shadow:0 4px 0 #c97c00, 0 10px 24px rgba(0,0,0,.35);}
  .bigbtn svg{width:46%;height:46%;}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .sub{margin-top:3.2vmin;font-size:min(4.6vmin,28px);font-weight:800;color:#e9f6ff;text-shadow:0 2px 6px rgba(0,0,0,.35);}
  .credit{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:0;right:0;font-size:min(3.2vmin,16px);
    color:rgba(255,255,255,.85);font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.4);}
  .tip{display:block;margin-top:4px;font-weight:600;opacity:.85;}

  /* Letter celebration card */
  #card{pointer-events:none;}
  #card .inner{display:flex;align-items:center;gap:3vmin;padding:2.5vmin 5vmin;border-radius:6vmin;
    background:rgba(255,255,255,.93);box-shadow:0 12px 40px rgba(0,40,90,.35);border:6px solid #ffd84d;
    animation:cardIn .5s cubic-bezier(.2,1.5,.4,1);}
  #card.out .inner{animation:cardOut .35s ease-in forwards;}
  #card .big{font-size:min(28vmin,200px);font-weight:900;color:var(--navy);line-height:1;}
  #card .pic{font-size:min(22vmin,160px);line-height:1;}
  #card .word{font-size:min(6vmin,40px);font-weight:900;color:#1d6fb8;margin-top:1vmin;}
  @keyframes cardIn{0%{transform:scale(.2) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes cardOut{to{transform:scale(.6);opacity:0}}

  /* Final celebration */
  #final{background:radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.10), rgba(3,35,75,.55));}
  #final .trophy{font-size:min(26vmin,190px);line-height:1;animation:bob 1.4s ease-in-out infinite;}
  #final h2{margin:2vmin 0 4vmin;font-size:min(9vmin,64px);font-weight:900;color:#ffd84d;text-shadow:0 4px 0 #0b4c86,0 8px 24px rgba(0,0,0,.35);}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-3vmin) rotate(4deg)}}

  /* Lives: 5 hearts (bottom-left; a row in landscape, a column in portrait so they stay clear of the current) */
  #lives{position:fixed;z-index:3;pointer-events:none;display:flex;gap:6px;--heart:clamp(26px,4.6vmin,44px);
    left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);}
  #lives.portrait{flex-direction:column-reverse;}
  #lives .h{display:block;width:var(--heart);height:var(--heart);}
  #lives svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 3px rgba(0,30,70,.35));transition:transform .3s, opacity .3s;}
  #lives .h.lost svg{opacity:.45;transform:scale(.78);}
  #lives .h.lost path{fill:#9db4cc;}
  #lives .h.pop svg{animation:heartPop .6s ease-out;}
  #lives .h.gain svg{animation:heartGain .7s cubic-bezier(.2,1.6,.4,1);}
  @keyframes heartPop{0%{transform:scale(1)}30%{transform:scale(1.55) rotate(-14deg)}100%{transform:scale(.78)}}
  @keyframes heartGain{0%{transform:scale(.2)}60%{transform:scale(1.35)}100%{transform:scale(1)}}

  /* Small corner buttons (music mute, free-swim play again) */
  .cornerbtn{position:fixed;z-index:6;appearance:none;outline:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;
    width:56px;height:56px;border-radius:50%;background:rgba(4,40,80,.38);border:2px solid rgba(255,255,255,.5);
    display:flex;align-items:center;justify-content:center;}
  .cornerbtn svg{width:60%;height:60%;display:block;}
  #mute{opacity:.72;}
  #mute .slash{display:none;}
  #mute.off{opacity:.9;}
  #mute.off .slash{display:inline;}
  #mute.land{left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(var(--stripB,60px) + 10px);}
  #mute.port{right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);}
  #replay{width:78px;height:78px;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(var(--stripB,60px) + 10px);
    background:radial-gradient(circle at 35% 30%, #d8ffd6, #5fd36a 45%, #2b9e3c);border:0;box-shadow:0 6px 0 #1f7a2d, 0 10px 24px rgba(0,0,0,.3);}
  #replay:active{transform:translateY(4px);box-shadow:0 2px 0 #1f7a2d;}

  /* Killer whales-eaten counter (free swim) */
  #counter{position:fixed;z-index:4;pointer-events:none;left:0;right:0;margin:0 auto;width:max-content;top:calc(var(--stripB,60px) + 10px);
    display:flex;align-items:center;gap:10px;padding:4px 20px 4px 10px;border-radius:999px;background:rgba(4,40,80,.42);
    border:3px solid rgba(255,255,255,.65);font-weight:900;font-size:min(8vmin,48px);line-height:1.1;color:#fff;text-shadow:0 2px 0 #0b4c86;}
  #counter canvas{width:min(15vmin,90px);height:min(7.5vmin,45px);display:block;}
  #counter.bump{animation:gotPop .45s cubic-bezier(.2,1.6,.4,1);}

  /* Game over */
  #over{background:radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.08), rgba(3,35,75,.6));}
  #overCroc{width:min(60vmin,400px);height:min(30vmin,200px);margin-bottom:1vmin;display:block;}
  #tryagain{background:radial-gradient(circle at 35% 30%, #d8ffd6, #5fd36a 45%, #2b9e3c);box-shadow:0 10px 0 #1f7a2d, 0 18px 40px rgba(0,0,0,.35);}
  #tryagain:active{box-shadow:0 4px 0 #1f7a2d, 0 10px 24px rgba(0,0,0,.35);}

  /* v4: level picker (start screen + end panels) */
  .levels{display:flex;align-items:flex-end;justify-content:center;gap:min(7vmin,56px);}
  .lvlpick{display:flex;flex-direction:column;align-items:center;}
  .lvlname{margin-top:2.6vmin;font-size:min(5.6vmin,34px);font-weight:900;color:#fff;text-shadow:0 3px 0 #0b4c86,0 6px 16px rgba(0,0,0,.35);line-height:1.05;}
  .lvlname small{display:block;font-size:.55em;font-weight:800;color:#e9f6ff;margin-top:2px;}
  .bigbtn.l2{width:min(28vmin,180px);height:min(28vmin,180px);flex-direction:column;
    background:radial-gradient(circle at 35% 30%, #d8ffd6, #5fd36a 45%, #2b9e3c);box-shadow:0 10px 0 #1f7a2d, 0 18px 40px rgba(0,0,0,.35);animation-delay:.4s;}
  .bigbtn.l2:active{box-shadow:0 4px 0 #1f7a2d, 0 10px 24px rgba(0,0,0,.35);}
  .bigbtn .num{font-size:min(15vmin,96px);font-weight:900;color:#0d2b52;line-height:.9;}
  .bigbtn.l2 .num{color:#0d3b1a;font-size:min(11vmin,70px);}
  .bigbtn canvas{width:62%;height:24%;display:block;}
  .bigbtn.huge{width:min(42vmin,270px);height:min(42vmin,270px);}
  .bigbtn.huge .num{font-size:min(17vmin,110px);}
  .bigbtn.small{width:min(22vmin,140px);height:min(22vmin,140px);}
  .bigbtn.green{background:radial-gradient(circle at 35% 30%, #d8ffd6, #5fd36a 45%, #2b9e3c);box-shadow:0 10px 0 #1f7a2d, 0 18px 40px rgba(0,0,0,.35);}
  .endpanel{justify-content:flex-end;pointer-events:none;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 5vmin);}
  .endpanel button{pointer-events:auto;}
  .endpanel h2{margin:0 0 3vmin;font-size:min(9vmin,64px);font-weight:900;color:#ffd84d;text-shadow:0 4px 0 #0b4c86,0 8px 24px rgba(0,0,0,.45);}
  .endpanel .levels{animation:cardIn .5s cubic-bezier(.2,1.5,.4,1);}
  .endpanel .lvlname{background:rgba(4,40,80,.6);padding:.25em .7em .3em;border-radius:999px;margin-top:2vmin;}
  .endpanel h2{background:rgba(4,40,80,.45);padding:.1em .6em .2em;border-radius:999px;}

  /* v4: small level badge (for Dad) */
  #lvl{position:fixed;z-index:3;pointer-events:none;width:56px;height:56px;border-radius:18px;background:rgba(4,40,80,.38);
    border:2px solid rgba(255,255,255,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#fff;font-weight:900;}
  #lvl small{font-size:10px;letter-spacing:.5px;opacity:.9;}
  #lvl b{font-size:26px;}
  #lvl.land{left:calc(env(safe-area-inset-left,0px) + 78px);top:calc(var(--stripB,60px) + 10px);}
  #lvl.port{right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);}
</style>
</head>
<body>
<canvas id="scene" aria-label="Underwater alphabet game"></canvas>
<div id="safe"></div>
<div id="strip" aria-hidden="true"></div>
<div id="lives" class="hidden" aria-hidden="true"></div>
<div id="counter" class="hidden" aria-live="polite"><canvas id="counterCroc" aria-hidden="true"></canvas><span id="counterNum">0</span></div>
<div id="lvl" class="land hidden" aria-label="Level"><small>LEVEL</small><b id="lvlNum">1</b></div>
<button id="mute" class="cornerbtn land hidden" aria-label="Music on or off" aria-pressed="false">
  <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M18 34V12l20-5v22" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="13" cy="34" rx="6" ry="5" fill="#fff"/><ellipse cx="33" cy="29" rx="6" ry="5" fill="#fff"/><path class="slash" d="M7 7L41 41" stroke="#ff5a6e" stroke-width="5" stroke-linecap="round"/></svg>
</button>
<button id="replay" class="cornerbtn hidden" aria-label="Play again"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M74 34 A30 30 0 1 0 80 56" fill="none" stroke="#0d3b1a" stroke-width="11" stroke-linecap="round"/><path d="M62 20 L84 30 L72 50 Z" fill="#0d3b1a" stroke="#0d3b1a" stroke-width="5" stroke-linejoin="round"/></svg></button>

<div id="start" class="overlay">
  <h1>Aaron's Shark <span class="abc">ABC</span></h1>
  <div class="levels">
    <div class="lvlpick">
      <button id="play" class="bigbtn" aria-label="Tap to play level 1">
        <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M30 18 L84 50 L30 82 Z" fill="#0d2b52" stroke="#0d2b52" stroke-width="10" stroke-linejoin="round"/></svg>
      </button>
      <div class="lvlname" id="play1Name">Level 1</div>
    </div>
    <div class="lvlpick">
      <button id="play2" class="bigbtn l2" aria-label="Play level 2: race the killer whale"><canvas class="crocIcon" aria-hidden="true"></canvas><span class="num">2</span></button>
      <div class="lvlname">Level 2<small>Race the killer whale!</small></div>
    </div>
  </div>
  <div class="sub">Pick your level!</div>
  <div class="credit">Designed by Dad (Adam Ennabe) for Aaron
    <span class="tip" id="a2hs">Tip: tap Share, then “Add to Home Screen” for full screen</span></div>
</div>

<div id="card" class="overlay hidden" aria-live="polite">
  <div class="inner">
    <div class="big" id="cardLetter">A</div>
    <div><div class="pic" id="cardPic">🍎</div><div class="word" id="cardWord">Apple</div></div>
  </div>
</div>

<div id="final" class="overlay hidden">
  <div class="trophy">🏆</div>
  <h2>A to Z! Hooray!</h2>
</div>

<!-- v4: Level 1 won (shark covers the screen): go to Level 2 or play Level 1 again -->
<div id="won" class="overlay endpanel hidden">
  <div class="levels">
    <div class="lvlpick">
      <button id="toL2" class="bigbtn l2 huge" aria-label="Level 2"><canvas class="crocIcon" aria-hidden="true"></canvas><span class="num">2</span></button>
      <div class="lvlname">Level 2!</div>
    </div>
    <div class="lvlpick">
      <button id="againL1" class="bigbtn small" aria-label="Play level 1 again"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M74 34 A30 30 0 1 0 80 56" fill="none" stroke="#0d2b52" stroke-width="11" stroke-linecap="round"/><path d="M62 20 L84 30 L72 50 Z" fill="#0d2b52" stroke="#0d2b52" stroke-width="5" stroke-linejoin="round"/></svg></button>
      <div class="lvlname">Level 1<small>again</small></div>
    </div>
  </div>
</div>

<!-- v4: Level 2 won (A to Z before the killer whale): play Level 2 again or go back to Level 1 -->
<div id="won2" class="overlay endpanel hidden">
  <h2>You beat the big killer whale!</h2>
  <div class="levels">
    <div class="lvlpick">
      <button id="againL2" class="bigbtn green" aria-label="Play level 2 again"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M74 34 A30 30 0 1 0 80 56" fill="none" stroke="#0d3b1a" stroke-width="11" stroke-linecap="round"/><path d="M62 20 L84 30 L72 50 Z" fill="#0d3b1a" stroke="#0d3b1a" stroke-width="5" stroke-linejoin="round"/></svg></button>
      <div class="lvlname">Play Again</div>
    </div>
    <div class="lvlpick">
      <button id="toL1" class="bigbtn small" aria-label="Back to level 1"><span class="num">1</span></button>
      <div class="lvlname">Level 1</div>
    </div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <canvas id="overCroc" aria-hidden="true"></canvas>
  <button id="tryagain" class="bigbtn" aria-label="Try again"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M74 34 A30 30 0 1 0 80 56" fill="none" stroke="#0d3b1a" stroke-width="11" stroke-linecap="round"/><path d="M62 20 L84 30 L72 50 Z" fill="#0d3b1a" stroke="#0d3b1a" stroke-width="5" stroke-linejoin="round"/></svg></button>
  <div class="sub">Try again!</div>
</div>

/* ================================================================
   Canvas + layout
   ================================================================ */
const cv = $('scene'), ctx = cv.getContext('2d');
const strip = $('strip');
let W = 0, H = 0, DPR = 1, portrait = false;
let G = null;            // play-area geometry + reference sizes
let bgCache = null;      // static background canvas
const scene = { weeds: [], bubbles: [], fish: [], rays: [] };

for (let i = 0; i < 26; i++) { const s = document.createElement('span'); s.textContent = ALPHABET[i]; strip.appendChild(s); }
const cells = Array.from(strip.children);

function safeArea() {
  const cs = getComputedStyle($('safe'));
  return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}

function layoutStrip() {
  strip.classList.toggle('portrait', portrait);
  cells.forEach((c, i) => { c.textContent = show(ALPHABET[i]); });
  const cols = portrait ? 13 : 26;
  const sa = safeArea();
  const inner = W - sa.l - sa.r - 20 - (cols - 1) * 4;
  const cell = Math.max(12, Math.min(48, inner / cols));
  strip.style.gridAutoRows = cell + 'px';
  strip.style.setProperty('--cell', cell + 'px');
  updateStrip();
}

function updateStrip() {
  cells.forEach((c, i) => {
    const got = i < game.index && !c.dataset.pending;
    c.classList.toggle('got', got);
    c.style.background = got ? `hsl(${Math.round(i * 360 / 26)},90%,74%)` : '';
    c.classList.toggle('next', i === game.index && /^(play|celebrate|snack|snackEnd|crocwin|party|partyEnd)$/.test(game.state));
  });
}

/* ---- Play-area geometry (v5: open water, no current). The sizes keep the v4 formulas as the reference:
   G.L = the v4 starting shark length (shark.scale 1), G.bubbleR = the big letter-bubble radius. ---- */
function buildGeometry() {
  const n = 3;
  const sa = safeArea();
  const sb = strip.getBoundingClientRect();
  const x0 = sa.l + 10, x1 = W - sa.r - 10, y0 = sb.bottom + 8, y1 = H - sa.b - 10;
  const pw = Math.max(50, x1 - x0), ph = Math.max(50, y1 - y0);
  const latLen = portrait ? pw : ph;
  const m = Math.min(pw, ph);
  const latM = 4, gap = Math.max(14, m * 0.04);
  const bubbleR = Math.max(16, Math.min(m * 0.15, 125, (latLen - 2 * latM - 6 * (n - 1)) / (2 * n)));
  const D = (latLen - 2 * (bubbleR + latM)) / (n - 1);
  const r = Math.max(10, Math.min((D - gap) / 2, bubbleR * 0.95, m * 0.16));
  const L = r * 2.8;
  G = { L, bubbleR, pw, ph, x0, x1, y0, y1, fwd: portrait ? -Math.PI / 2 : 0 };
}
// where the letter bubbles may float (open water, away from the hearts / buttons and from the shark's start spot)
function letterZone() {
  const R = curR(), m = R + 12, top = stripBottom + 12 + R, bot = H - SA.b - 12 - R;
  if (portrait) return { x0: SA.l + m, x1: Math.max(SA.l + m + 1, W - SA.r - m), y0: top, y1: Math.max(top + 1, bot) };   // the shark's body is kept clear in layoutLetters()
  return { x0: Math.max(SA.l + m, W * 0.4), x1: Math.max(W * 0.4 + 1, W - SA.r - m), y0: top, y1: Math.max(top + 1, bot) };
}
function layoutLetters() {   // random, well-spaced spots for this round's bubbles
  if (isRace() || !game.letters.length) return;
  const z = letterZone(), R = curR(), home = startPos(), Ls = sharkLen();
  // the shark at his start spot as a capsule (tail -> nose along his heading), so bubbles may sit beside a slim shark
  // (he levels out horizontally when resting, so on portrait screens both the start heading and level are kept clear,
  //  and also wherever he is right now, so a new round's letters never pop up on top of him)
  const caps = [[home, 0], [home, Math.PI], [shark, shark.heading], [shark, 0], [shark, Math.PI]].map(([c, a]) => {
    const fx = Math.cos(a), fy = Math.sin(a);
    return [{ x: c.x - fx * Ls * 0.55, y: c.y - fy * Ls * 0.55 }, { x: c.x + fx * Ls * 0.5, y: c.y + fy * Ls * 0.5 }];
  });
  const segD = p => Math.min(...caps.map(([tail, nose]) => { const dx = nose.x - tail.x, dy = nose.y - tail.y, u = clamp(((p.x - tail.x) * dx + (p.y - tail.y) * dy) / (dx * dx + dy * dy || 1), 0, 1); return Math.hypot(p.x - tail.x - dx * u, p.y - tail.y - dy * u); }));
  const huds = ['lives', 'mute', 'lvl'].map(id => $(id)).filter(e => e && !e.classList.contains('hidden')).map(e => e.getBoundingClientRect()).filter(r => r.width > 0);
  const hudGap = p => Math.min(1e9, ...huds.map(r => Math.hypot(Math.max(r.left - p.x, 0, p.x - r.right), Math.max(r.top - p.y, 0, p.y - r.bottom)) - R * 1.1));
  let best = null, bestScore = -1;
  for (let tries = 0; tries < 1500 && bestScore < 1; tries++) {
    const pts = game.letters.map(() => ({ x: rand(z.x0, z.x1), y: rand(z.y0, z.y1) }));
    let minD = Infinity, minS = Infinity, minH = Infinity;
    for (let i = 0; i < pts.length; i++) {
      minS = Math.min(minS, segD(pts[i]) - Ls * 0.2 - R);
      minH = Math.min(minH, hudGap(pts[i]));
      for (let j = i + 1; j < pts.length; j++) minD = Math.min(minD, dist(pts[i], pts[j]));
    }
    let score = Math.min(minD / (2.6 * R), (minS + R) / (1.3 * R));   // >= 1: bubbles 2.6 R apart, >= 0.3 R clear of his body
    if (minH < 0) score *= 0.5;   // never on top of the hearts / music button / level badge if it can be helped
    if (score > bestScore) { bestScore = score; best = pts; }
  }
  game.letters.forEach((l, i) => { l.x = best[i].x; l.y = best[i].y; });
}

/* ---- Decorative scene (seaweed, bubbles, fish, light rays) ---- */
function buildScene() {
  const m = Math.min(W, H);
  const sandTop = H - Math.max(26, H * 0.07);
  scene.sandTop = sandTop;
  const nWeeds = Math.round(W / 70) + 4;
  scene.weeds = [];
  const greens = ['#2fa36b', '#3cc47f', '#22915c', '#57d18d', '#1f8a5a'];
  for (let i = 0; i < nWeeds; i++) {
    scene.weeds.push({ x: rand(0, W), y: sandTop + rand(4, 18), h: rand(0.1, 0.26) * H, w: rand(8, 16) * Math.max(0.7, m / 700),
      phase: rand(0, 6.28), speed: rand(0.8, 1.4), color: greens[i % greens.length], segs: 9 });
  }
  scene.weeds.sort((a, b) => a.y - b.y);
  scene.bubbles = [];
  const nB = Math.round((W * H) / 26000) + 12;
  for (let i = 0; i < nB; i++) scene.bubbles.push(newBubble(true));
  scene.fish = [];
  const fishColors = ['#ffb347', '#ff7aa2', '#ffe066', '#8be9fd'];
  for (let i = 0; i < 4; i++) scene.fish.push({ x: rand(0, W), y: rand(0.2, 0.8) * H, s: rand(0.6, 1) * Math.max(14, m * 0.028), v: rand(18, 40) * (Math.random() < .5 ? -1 : 1), phase: rand(0, 6), color: fishColors[i] });
  scene.rays = [];
  for (let i = 0; i < 5; i++) scene.rays.push({ x: rand(0.05, 0.95) * W, w: rand(0.05, 0.12) * W, phase: rand(0, 6), a: rand(0.05, 0.1) });
  buildBackground(sandTop);
}
function newBubble(anywhere) {
  return { x: rand(0, W), y: anywhere ? rand(0, H) : H + rand(10, 60), r: rand(2.5, 9) * Math.max(0.8, Math.min(W, H) / 700), v: rand(22, 60), phase: rand(0, 6.28), front: Math.random() < 0.18 };
}

function buildBackground(sandTop) {
  bgCache = document.createElement('canvas');
  bgCache.width = Math.round(W * DPR); bgCache.height = Math.round(H * DPR);
  const c = bgCache.getContext('2d');
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#5fd0f3'); g.addColorStop(0.35, '#2a9ee0'); g.addColorStop(1, '#0b5aa0');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // distant soft rocks
  c.fillStyle = 'rgba(8,70,130,0.35)';
  for (let i = 0; i < 6; i++) { const x = (i + 0.3) * W / 5.5, rw = rand(0.12, 0.22) * W, rh = rand(0.06, 0.13) * H; c.beginPath(); c.ellipse(x, sandTop + 6, rw / 2, rh, 0, Math.PI, 0); c.fill(); }
  // sand
  const sg = c.createLinearGradient(0, sandTop - 10, 0, H);
  sg.addColorStop(0, '#f6e3a8'); sg.addColorStop(1, '#e2c27a');
  c.fillStyle = sg; c.beginPath(); c.moveTo(0, H); c.lineTo(0, sandTop);
  for (let x = 0; x <= W + 20; x += 20) c.lineTo(x, sandTop + Math.sin(x * 0.015) * 6 + Math.sin(x * 0.041) * 3);
  c.lineTo(W, H); c.closePath(); c.fill();
  // sand speckles
  c.fillStyle = 'rgba(180,140,70,0.35)';
  for (let i = 0; i < W / 6; i++) { c.beginPath(); c.arc(rand(0, W), rand(sandTop + 8, H), rand(0.8, 2), 0, 7); c.fill(); }
  // coral clusters
  const coralColors = ['#ff7f9e', '#ff9f6b', '#c48bff'];
  for (let i = 0; i < 3; i++) drawCoral(c, rand(0.05, 0.95) * W, sandTop + 10, Math.max(30, Math.min(W, H) * 0.09), coralColors[i]);
  // starfish + shells
  for (let i = 0; i < 3; i++) drawStar(c, rand(0.05, 0.95) * W, rand(sandTop + 14, H - 8), Math.max(8, Math.min(W, H) * 0.018), '#ff8a65');
}
function drawCoral(c, x, y, s, color) {
  c.save(); c.translate(x, y); c.strokeStyle = color; c.lineCap = 'round';
  const branch = (len, ang, w, depth) => {
    if (depth <= 0) return;
    c.save(); c.rotate(ang); c.lineWidth = w; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -len); c.stroke();
    c.translate(0, -len); branch(len * 0.7, -0.5, w * 0.72, depth - 1); branch(len * 0.7, 0.45, w * 0.72, depth - 1); c.restore();
  };
  branch(s * 0.55, 0, s * 0.16, 3); c.restore();
}
function drawStar(c, x, y, r, color) {
  c.save(); c.translate(x, y); c.rotate(rand(0, 1)); c.fillStyle = color; c.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  c.closePath(); c.fill(); c.restore();
}

/* ================================================================
   Shark drawing (local coords, facing +x, length L, centered)
   ================================================================ */
function sharkBodyPath(L) {   // the shark's body outline (also used to measure how much of the screen he covers)
  const body = new Path2D();
  body.moveTo(-L * 0.41, -L * 0.05);
  body.bezierCurveTo(-L * 0.2, -L * 0.15, 0, -L * 0.235, L * 0.22, -L * 0.2);
  body.bezierCurveTo(L * 0.38, -L * 0.17, L * 0.5, -L * 0.08, L * 0.56, -L * 0.005);
  body.bezierCurveTo(L * 0.5, L * 0.11, L * 0.32, L * 0.21, L * 0.08, L * 0.215);
  body.bezierCurveTo(-L * 0.12, L * 0.215, -L * 0.27, L * 0.12, -L * 0.41, L * 0.05);
  body.closePath();
  return body;
}
function drawShark(c, L, o) {
  // v2 "cool & tough" shark: pointy snout + fins, open grin with white teeth, angled brow. Facing +x.
  // v5: o.skin = colors (Aaron = AARON_SKIN), o.princess = tiara + eyelashes + rosy cheek + friendly round eye
  const tail = o.tail || 0, fin = o.fin || 0, blink = o.blink || 0, chomp = clamp(o.chomp || 0, 0, 1);

  c.quadraticCurveTo(-L * 0.08, -L * 0.11, -L * 0.22, -L * 0.25);
  c.quadraticCurveTo(-L * 0.15, -L * 0.07, -L * 0.12, 0);
  c.quadraticCurveTo(-L * 0.14, L * 0.07, -L * 0.2, L * 0.2);
  c.quadraticCurveTo(-L * 0.07, L * 0.1, L * 0.05, L * 0.06);

  c.quadraticCurveTo(L * 0.02, -L * 0.28, L * 0.12, -L * 0.19);

  c.strokeStyle = 'rgba(20,40,80,0.4)'; c.lineWidth = lw * 1.1;
  for (let i = 0; i < 3; i++) { const gx = L * (0.08 - i * 0.045); c.beginPath(); c.moveTo(gx + L * 0.012, -L * 0.075); c.quadraticCurveTo(gx - L * 0.016, 0, gx + L * 0.012, L * 0.06); c.stroke(); }
  c.restore();
  c.strokeStyle = outline; c.lineWidth = lw; c.stroke(body);
  // pectoral fin (pointy; o.fin also makes the princesses wave bye-bye)
  c.save(); c.translate(L * 0.02, L * 0.12); c.rotate(0.2 + fin);
  c.fillStyle = finCol; c.strokeStyle = outline; c.lineWidth = lw;
  c.beginPath(); c.moveTo(L * 0.06, -L * 0.02); c.quadraticCurveTo(L * 0.0, L * 0.14, -L * 0.16, L * 0.21);
  c.quadraticCurveTo(-L * 0.06, L * 0.06, -L * 0.07, -L * 0.02); c.closePath(); c.fill(); c.stroke();
  c.restore();
  // open grin with pointy white teeth
  const mA = { x: L * 0.22, y: L * 0.06 }, mB = { x: L * 0.515, y: L * 0.022 };
  const up = { x: L * 0.37, y: L * 0.095 }, lo = { x: L * 0.36, y: L * (0.235 - 0.15 * chomp) };   // chomp closes the jaw
  const mouth = new Path2D();
  mouth.moveTo(mA.x, mA.y); mouth.quadraticCurveTo(up.x, up.y, mB.x, mB.y); mouth.quadraticCurveTo(lo.x, lo.y, mA.x, mA.y); mouth.closePath();
  c.fillStyle = '#1d1f3d'; c.fill(mouth);

  c.fillStyle = '#e05a7a'; // tongue (soft pink, not scary)
  c.beginPath(); c.ellipse(L * 0.35, L * 0.185, L * 0.08, L * 0.035, -0.1, 0, Math.PI * 2); c.fill();
  const q = (a, ctl, b, t) => ({ x: (1 - t) * (1 - t) * a.x + 2 * (1 - t) * t * ctl.x + t * t * b.x, y: (1 - t) * (1 - t) * a.y + 2 * (1 - t) * t * ctl.y + t * t * b.y });

  }

    const p = q(mA, lo, mB, 0.17 + i * 0.16);
    c.beginPath(); c.moveTo(p.x - tw * 0.42, p.y + 2); c.lineTo(p.x + tw * 0.42, p.y + 2); c.lineTo(p.x, p.y - th * 0.75); c.closePath(); c.fill(); c.stroke();

    const er = L * 0.075;
    c.save(); c.translate(L * 0.255, -L * 0.075);
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, er, 0, Math.PI * 2); c.fill();
    c.strokeStyle = outline; c.lineWidth = lw; c.stroke();
    c.strokeStyle = '#13213f'; c.lineWidth = Math.max(2, L * 0.03);
    c.beginPath(); c.moveTo(-er * 0.55, -er * 0.55); c.lineTo(er * 0.55, er * 0.55); c.moveTo(er * 0.55, -er * 0.55); c.lineTo(-er * 0.55, er * 0.55); c.stroke();
    c.restore(); c.restore();

  }

  if (princess) {   // friendly round eye with lashes + a rosy cheek
    c.fillStyle = 'rgba(255,120,160,0.55)'; c.beginPath(); c.ellipse(L * 0.2, L * 0.02, L * 0.05, L * 0.028, 0, 0, Math.PI * 2); c.fill();
    c.save(); c.translate(L * 0.255, -L * 0.08); c.scale(1, 1 - blink * 0.9);
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, er, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#1b2440'; c.beginPath(); c.arc(er * 0.22, er * 0.1, er * 0.6, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(er * 0.45, -er * 0.15, er * 0.22, 0, Math.PI * 2); c.fill();

  const n = level().choices;

  const pool = shuffle(ALPHABET.filter(ch => ch !== target)).slice(0, n - 1);
  const chars = shuffle([target, ...pool]);
  game.letters = chars.map((ch, i) => ({ ch, branch: i, correct: ch === target, x: 0, y: 0, scale: 0, scaleTarget: 1, delay: i * 0.12, phase: rand(0, 6), wobble: 0, glow: 0, gone: false, armed: true }));

/* ---- v5: a clear "power-up" grow: he pulses between the old and the new size, stars, "BIGGER!" and a rising sound ---- */
function growShark(to) {

/* ---- killer whales ---- */
function makeCroc(o) { return Object.assign({ x: 0, y: 0, L: 100, dir: -1, jaw: 0, jawAuto: true, phase: rand(0, 6), eyes: 'normal', bulge: 0, vx: 0, role: 'free', enterK: 1, flip: 0 }, o); }

/* ---- killer whales that swim in and wander around on screen (snack breaks + the ending) ---- */
function crocBounds(Lc) {

  return { x0: SA.l + Lc * 0.55, x1: Math.max(SA.l + Lc * 0.55 + 1, W - SA.r - Lc * 0.55), y0: top, y1: Math.max(top + 1, bot) };

function spawnWanderCroc(role, kind) {
  const sc = Math.max(0.6, Math.min(W, H) / 700);

  const Lc = role === 'snack' ? Math.max(G.L * 0.36, sharkLen() * rand(0.62, 0.8)) : G.L * rand(0.62, 0.82);
  const b = crocBounds(Lc);

  }

  else if (!w.entering) { w.tx = clamp(w.tx, b.x0, b.x1); w.ty = clamp(w.ty, b.y0, b.y1); }
  const dx = w.tx - c.x, dy = w.ty - c.y, d = Math.hypot(dx, dy);

/* ---- Level 1 snack break: after a random 2-4 letters, eat 2-3 killer whales that swim in; at the end he GROWS ---- */
function pickBreak() { return BREAK_FIXED ? clamp(BREAK_FIXED, 1, 26) : BREAK_MIN + Math.floor(Math.random() * (BREAK_MAX - BREAK_MIN + 1)); }

function startSnack() {

  game.state = 'snack'; game.seq++; game.breaks++;
  game.breakLog.push(game.sinceBreak); game.breakAt.push(game.index);
  game.sinceBreak = 0; game.breakEvery = pickBreak();
  snack.goal = SNACK_MIN + Math.floor(Math.random() * (SNACK_MAX - SNACK_MIN + 1));
  snack.eaten = 0; snack.spawned = 0; snack.t = 0;
  snack.kinds = pickSnackKinds();   // v15: [croc, random, random]

function update(dt) {
  T += dt;

  for (const b of scene.bubbles) {
    b.y -= b.v * dt; b.x += Math.sin(T * 2 + b.phase) * 10 * dt;
    if (b.y < -20) Object.assign(b, newBubble(false));
  }
  for (const f of scene.fish) {
    f.x += f.v * dt; f.y += Math.sin(T + f.phase) * 6 * dt;
    if (f.x > W + 60) f.x = -60; if (f.x < -60) f.x = W + 60;
  }

  // letters
  for (const l of game.letters) {
    if (l.delay > 0) { l.delay -= dt; continue; }
    const k = l.scaleTarget > l.scale ? 7 : 10;
    l.scale += (l.scaleTarget - l.scale) * Math.min(1, dt * k);
    l.wobble = Math.max(0, l.wobble - dt * 1.4);
    const wantGlow = game.state === 'play' && l.correct && (game.idle > 9 || game.wrongs >= 2 || (isRace() && race.hint)) ? 1 : 0;   // glow hint after 2 misses (or a croc win) this round
    l.glow += (wantGlow - l.glow) * Math.min(1, dt * 3);
  }
  if (game.state === 'play') {   // v5: wrong-letter grace time; a bubble that was bumped only counts again once he swam away from it
    if (!shark.scripted) game.grace = Math.max(0, game.grace - dt);   // the grace time starts once the bounce is over
    for (const l of game.letters) if (l.armed === false && dist(shark, letterPos(l)) > curR() * 1.25 + sharkLen() * 0.3) l.armed = true;
  }
  if (game.state === 'play' && !game.dragging && !shark.anim) game.idle += dt;
  if (game.state === 'play' && game.idle > 9 && !game.hinted) { game.hinted = true; Voice.play('f_' + ALPHABET[game.index].toLowerCase()); }

  // shark
  shark.px = shark.x; shark.py = shark.y;
  updateTweens(dt);
  if (shark.scripted) {
    // position driven by tweens (swim home, bounce, game-over float, finales)
  } else if (freeMove()) {
    const playing = game.state === 'play';
    if ((game.dragging || playing) && game.target) {   // letter rounds: after letting go he keeps swimming to the finger's last spot
      const k = 1 - Math.exp(-dt * (game.near && game.dragging ? 18 : 6));
      shark.x = lerp(shark.x, game.target.x, k); shark.y = lerp(shark.y, game.target.y, k);

    }
    const b = freeBounds();
    shark.x = clamp(shark.x, b.x0, b.x1); shark.y = clamp(shark.y, b.y0, b.y1);
    if (playing && game.target) checkReach(false);

  const vx = (shark.x - shark.px) / Math.max(dt, 1e-3), vy = (shark.y - shark.py) / Math.max(dt, 1e-3);
  const sp = Math.hypot(vx, vy);
  shark.speed += (sp - shark.speed) * Math.min(1, dt * 10);
  let want = game.state === 'won' ? G.fwd : (Math.cos(shark.heading) < 0 ? Math.PI : 0);   // v5: he rests level (open water); faces up only for the portrait ending
  if (shark.faceAng !== null) want = shark.faceAng;
  else if (sp > 25 && !(shark.anim && shark.anim.faceFwd)) want = Math.atan2(vy, vx);
  else if (freeMove()) want = Math.cos(shark.heading) < 0 ? Math.PI : 0;   // level out when resting
  const turn = shark.faceAng !== null || sp > 25 ? 10 : 4;
  shark.heading += angDiff(shark.heading, want) * Math.min(1, dt * turn);
  shark.tailPhase += dt * (5 + Math.min(shark.speed, 700) * 0.025);
  shark.attn = Math.max(0, shark.attn - dt * 1.5);
  shark.spin = Math.min(1, shark.spin + dt / (0.9 * Math.max(SPEED, .5)));
  shark.blinkT -= dt;

  shark.blink = Math.max(0, shark.blink - dt * 7);

  if (game.state === 'final') {
    game.finalT += dt;
    if (shark.spin >= 1 && Math.random() < dt * 0.6) shark.spin = 0;
    if (Math.random() < dt * 1.5) burst(rand(0.1, 0.9) * W, rand(0.15, 0.5) * H, 40, true);
  }
  if ((game.state === 'bosswon' || (game.state === 'party' && !game.dragging)) && shark.spin >= 1 && Math.random() < dt * 0.25) shark.spin = 0;   // Aaron dances too

  if (friends.length) updateFriends(dt);

  if (boss.croc || game.state === 'boss' || game.state === 'bosswon') updateBoss(dt);
  if (game.state === 'won' || game.state === 'bosswon') confettiShower(dt);

  // killer whales
  for (let i = crocs.length - 1; i >= 0; i--) {

    if (c.vx) c.x += c.vx * dt;
    if (c.wander && !c.leaving) updateWander(c, dt);
    if (c.jawAuto) c.jaw = 0.12 + 0.3 * (0.5 + 0.5 * Math.sin(T * 3.4 + c.phase * 0.2));
    if (c.role === 'free' && ((c.vx < 0 && c.x < -c.L) || (c.vx > 0 && c.x > W + c.L))) crocs.splice(i, 1);
  }
  for (let i = popTexts.length - 1; i >= 0; i--) { popTexts[i].age += dt; if (popTexts[i].age > popTexts[i].life) popTexts.splice(i, 1); }

  // particles
  const grav = 520 * Math.max(0.7, Math.min(W, H) / 700);

    else if (p.kind === 's') { p.vx *= (1 - dt * 2.2); p.vy = p.vy * (1 - dt * 2.2) + 50 * dt; p.rot += p.vr * dt; }
    else if (p.kind === 'g' || p.kind === 'p') { p.vx *= (1 - dt * 1.8); p.vy = p.vy * (1 - dt * 1.8) - 12 * dt; }
    else { p.vx *= (1 - dt * 2.5); p.vy = p.vy * (1 - dt * 2.5) - 60 * dt; }
